name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "35 */6 * * *"
jobs:
  # Seconds-long hermetic checks (repo writers, build helpers) gate the
  # minutes-long image matrix.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v5
     - name: Set matrix data
       id: set-matrix
       run: echo "matrix=$(jq -c . < ./distro_versions.json)" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, configure]
    strategy:
      # allow pushing successfully built images anyway
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: "Set up RPM client User-Agent for images"
        run: |
          sed -i "s@XXXXXXXXXX@${{ secrets.RPMBUILDER_UA }}@g" assets/transient/fix-repos.sh
          sed -i "s@XXXXXXXXXX@${{ secrets.RPMBUILDER_UA }}@g" assets/transient/user-agent.py

      - name: Generate Dockerfile
        run: ./crypt-keeper.sh generate ${{ matrix.os }} ${{ matrix.version }}

      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          MAX_ATTEMPTS=5
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            if echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin; then
              exit 0
            fi
            echo "docker login attempt $attempt of $MAX_ATTEMPTS failed."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 15 seconds..."
              sleep 15
            fi
          done
          echo "All $MAX_ATTEMPTS docker login attempts failed."
          exit 1

      - name: Build And Push Docker Image with Retry
        id: build
        run: |
          # setup.sh already recovers from mirror-pool lag inside each attempt
          # (metadata refresh + EL origin fallback), so few outer attempts suffice.
          MAX_ATTEMPTS=4
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS: Building Docker image..."
            if ./crypt-keeper.sh build ${{ matrix.os }} ${{ matrix.version }}; then
              echo "built=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in 60 seconds..."
              sleep 60
            fi
          done
          echo "All $MAX_ATTEMPTS attempts failed."
          echo "built=false" >> "$GITHUB_OUTPUT"
          # Scheduled rebuilds run every 6h and a failure leaves the previous
          # image serving. Only alert once the published image is genuinely stale,
          # so a transient upstream outage never pages anyone. Push and manual
          # runs always fail hard: those validate a code change.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            IMAGE="getpagespeed/rpmbuilder:${{ matrix.os }}-${{ matrix.version }}"
            if python3 ci/image_freshness.py "$IMAGE" --max-age-hours 24; then
              echo "::warning::${IMAGE} rebuild failed (likely upstream); published image is still fresh, not alerting"
              exit 0
            fi
            echo "::error::${IMAGE} has not been rebuilt for over 24h"
          fi
          exit 1

      - name: Test RPM Build using the image
        if: steps.build.outputs.built == 'true'
        run: ./crypt-keeper.sh test ${{ matrix.os }} ${{ matrix.version }}

      - name: Push to Docker Hub
        if: steps.build.outputs.built == 'true'
        run: ./crypt-keeper.sh push ${{ matrix.os }} ${{ matrix.version }}
